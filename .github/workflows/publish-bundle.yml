name: Publish reviewed community bundle

on:
  workflow_dispatch:
    inputs:
      action:
        description: Prepare assets, or confirm after the catalog is deployed
        required: true
        type: choice
        options:
          - prepare
          - confirm
      submission_id:
        description: Reviewed private bundle submission identifier
        required: true
        type: string
      publication_attempt:
        description: Server-issued publication attempt token (prepare only)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: bundle-publication-${{ inputs.submission_id }}
  cancel-in-progress: false

jobs:
  prepare:
    if: inputs.action == 'prepare'
    environment: bundle-publishing
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/workflows/bundle-validation-requirements.txt

      - name: Install pinned image validator
        run: python -m pip install --require-hashes -r .github/workflows/bundle-validation-requirements.txt

      - name: Check server-issued identifiers
        env:
          SUBMISSION_ID: ${{ inputs.submission_id }}
          PUBLICATION_ATTEMPT: ${{ inputs.publication_attempt }}
        run: |
          [[ "$SUBMISSION_ID" =~ ^[a-z0-9_-]{20,40}$ ]]
          [[ "$PUBLICATION_ATTEMPT" =~ ^[A-Za-z0-9_-]{32}$ ]]

      # The private-read credential exists only in these curl processes. No
      # repository code or decoder is executed with it in the environment.
      - name: Fetch immutable moderated canonical inputs
        env:
          SUBMISSION_ID: ${{ inputs.submission_id }}
          CANONICAL_READ_KEY: ${{ secrets.BUNDLE_CANONICAL_READ_KEY }}
          PUBLICATION_ATTEMPT: ${{ inputs.publication_attempt }}
        run: |
          install -d -m 0700 publication-input/canonical-objects
          curl --fail --silent --show-error \
            --header "X-Bundle-Canonical-Read-Key: $CANONICAL_READ_KEY" \
            --header "X-Bundle-Publication-Attempt: $PUBLICATION_ATTEMPT" \
            --output publication-input/canonical-index.json \
            "https://avianvisitors.com/api/bundles/publication/$SUBMISSION_ID/canonical-index"
          jq -e '
            .schema_version == 1 and
            .canonicalization == "rgba-png-zero-transparent-v1" and
            (.input_archive_sha256 | test("^[0-9a-f]{64}$")) and
            (.input_manifest_sha256 | test("^[0-9a-f]{64}$")) and
            (.publish_manifest_sha256 | test("^[0-9a-f]{64}$")) and
            (.object_inventory_sha256 | test("^[0-9a-f]{64}$")) and
            (.objects | type == "array" and length >= 1 and length <= 1500) and
            (all(.objects[];
              (.ordinal | type == "number" and floor == . and . >= 0 and . < 1500) and
              (.file | type == "string" and test("^illustrations/[a-z0-9]+(?:-[a-z0-9]+)*(?:-2)?\\.png$")) and
              (.sha256 | type == "string" and test("^[0-9a-f]{64}$")) and
              (.bytes | type == "number" and floor == . and . >= 1 and . <= 4194304) and
              (.width | type == "number" and floor == . and . >= 1 and . <= 4096) and
              (.height | type == "number" and floor == . and . >= 1 and . <= 4096)
            )) and
            ([.objects[].ordinal] == [range(0; .objects | length)])
          ' publication-input/canonical-index.json > /dev/null
          curl --fail --silent --show-error \
            --header "X-Bundle-Canonical-Read-Key: $CANONICAL_READ_KEY" \
            --header "X-Bundle-Publication-Attempt: $PUBLICATION_ATTEMPT" \
            --output publication-input/canonical-manifest.json \
            "https://avianvisitors.com/api/bundles/publication/$SUBMISSION_ID/canonical-manifest"
          curl --fail --silent --show-error \
            --header "X-Bundle-Canonical-Read-Key: $CANONICAL_READ_KEY" \
            --header "X-Bundle-Publication-Attempt: $PUBLICATION_ATTEMPT" \
            --output publication-input/submission-context.json \
            "https://avianvisitors.com/api/bundles/publication/$SUBMISSION_ID/context"
          while IFS= read -r ORDINAL; do
            printf -v TARGET 'publication-input/canonical-objects/%04d.png' "$ORDINAL"
            curl --fail --silent --show-error \
              --header "X-Bundle-Canonical-Read-Key: $CANONICAL_READ_KEY" \
              --header "X-Bundle-Publication-Attempt: $PUBLICATION_ATTEMPT" \
              --output "$TARGET" \
              "https://avianvisitors.com/api/bundles/publication/$SUBMISSION_ID/canonical-objects/$ORDINAL"
          done < <(jq -r '.objects[].ordinal' publication-input/canonical-index.json)
          chmod 0444 \
            publication-input/canonical-index.json \
            publication-input/canonical-manifest.json \
            publication-input/submission-context.json \
            publication-input/canonical-objects/*.png

      # This process gets no secret or network. It runs under nobody with empty
      # groups/no-new-privs, a private TMPDIR, and no checkout write access. It
      # copies exact moderated objects and decodes only the bounded preview set.
      - name: Materialize persisted canonical package without credentials or network
        env:
          SUBMISSION_ID: ${{ inputs.submission_id }}
        run: |
          PYTHON_BIN="$(command -v python)"
          sudo chgrp -R nogroup publication-input
          chmod 0750 publication-input
          chmod 0750 publication-input/canonical-objects
          chmod 0440 \
            publication-input/canonical-index.json \
            publication-input/canonical-manifest.json \
            publication-input/submission-context.json \
            publication-input/canonical-objects/*.png
          sudo install -d -o nobody -g nogroup -m 0755 publication-output
          sudo install -d -o nobody -g nogroup -m 0700 publication-output/decoder-tmp
          set +e
          timeout 20m sudo unshare --net -- setpriv \
            --reuid=nobody --regid=nogroup --clear-groups --no-new-privs \
            env -i PATH="$(dirname "$PYTHON_BIN"):/usr/bin:/bin" \
            TMPDIR="$PWD/publication-output/decoder-tmp" \
            "$PYTHON_BIN" avian/scripts/bundle_publication_package.py "$SUBMISSION_ID" \
            --canonical-index publication-input/canonical-index.json \
            --canonical-manifest publication-input/canonical-manifest.json \
            --canonical-objects publication-input/canonical-objects \
            --context publication-input/submission-context.json \
            --output publication-output/package > materialization-result.json
          STATUS=$?
          sudo chmod -R u+rwX publication-input || true
          find publication-input -type f -exec shred --remove --zero {} + || true
          rm -rf publication-input
          sudo rm -rf publication-output/decoder-tmp
          sudo chown -R "$(id -u):$(id -g)" publication-output
          exit "$STATUS"

      # The decoder has exited before this step receives BUNDLE_PUBLISH_KEY.
      # The uploader performs bounded byte/hash/JSON checks and never imports
      # Pillow, opens a ZIP, or executes contributor content.
      - name: Upload immutable public bytes
        env:
          BUNDLE_PUBLISH_KEY: ${{ secrets.BUNDLE_PUBLISH_KEY }}
          SUBMISSION_ID: ${{ inputs.submission_id }}
          PUBLICATION_ATTEMPT: ${{ inputs.publication_attempt }}
        run: |
          python avian/scripts/bundle_publish.py upload "$SUBMISSION_ID" \
            --package publication-output/package \
            --attempt "$PUBLICATION_ATTEMPT" \
            --output publication-result.json
          {
            echo '### Catalog entry'
            echo '```json'
            python -c 'import json; print(json.dumps(json.load(open("publication-result.json"))["catalog_entry"], indent=2))'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  confirm:
    if: inputs.action == 'confirm'
    environment: bundle-publishing
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Confirm deployed catalog entry
        env:
          BUNDLE_PUBLISH_KEY: ${{ secrets.BUNDLE_PUBLISH_KEY }}
          SUBMISSION_ID: ${{ inputs.submission_id }}
        run: python avian/scripts/bundle_publish.py confirm "$SUBMISSION_ID"

  report_failure:
    needs: prepare
    if: ${{ always() && inputs.action == 'prepare' && needs.prepare.result != 'success' }}
    environment: bundle-publishing
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No checkout or input artifact reaches this callback. A 409 means the
      # exact manifest is already approved or a newer attempt owns the lease.
      - name: Release an approval request that failed before manifest staging
        env:
          BUNDLE_PUBLISH_KEY: ${{ secrets.BUNDLE_PUBLISH_KEY }}
          SUBMISSION_ID: ${{ inputs.submission_id }}
          PUBLICATION_ATTEMPT: ${{ inputs.publication_attempt }}
        run: |
          STATUS=$(curl --silent --show-error \
            --request POST \
            --header "X-Bundle-Publish-Key: $BUNDLE_PUBLISH_KEY" \
            --header "X-Bundle-Publication-Attempt: $PUBLICATION_ATTEMPT" \
            --header "Content-Type: application/json" \
            --data '{}' \
            --output publication-failure-response.json \
            --write-out '%{http_code}' \
            "https://avianvisitors.com/api/bundles/publication/$SUBMISSION_ID/review-failed")
          [[ "$STATUS" == "200" || "$STATUS" == "409" ]]
